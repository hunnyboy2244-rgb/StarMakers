
   <!DOCTYPE html>  <html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>StarMakers Registration</title>  
</head>  <body style="background-color: rgb(18, 18, 18); color: white; font-family: Arial; padding: 30px;">  <h1 style="color: rgb(255, 179, 0); text-align: center;">  
    StarMakers Registration  
</h1>  

<p style="text-align: center;">  
    Join StarMakers and showcase your musical talent.  
</p>  

<form style="max-width: 500px; margin: auto;">  

    <label>Full Name:</label><br>  
    <input type="text" name="name" style="width: 100%; padding: 10px;"><br><br>  

    <label>Email:</label><br>  
    <input type="email" name="email" style="width: 100%; padding: 10px;"><br><br>  

    <label>Phone Number:</label><br>  
    <input type="tel" name="phone" style="width: 100%; padding: 10px;"><br><br>  

    <label>Music Genre:</label><br>  
    <select name="genre" style="width: 100%; padding: 10px;">  
        <option>Afrobeats</option>  
        <option>Afropop</option>  
        <option>RnB</option>  
        <option>Hip Hop</option>  
        <option>Gospel</option>  
    </select><br><br>  

    <button type="submit"  
        style="background-color: rgb(255, 179, 0);  
        color: rgb(18, 18, 18);  
        padding: 12px 30px;  
        border: none;  
        border-radius: 25px;  
        font-size: 18px;  
        font-weight: bold;  
        cursor: pointer;">  
        Submit Registration  
    </button>  

</form>

</body>  
</html>
